[package]
name = "on99kb"
version = "1.2.0"
edition = "2021"
authors = ["Timothy Lam <him1017@gmail.com>"]
description = "Resizable always-on-top Windows on-screen keyboard for IBM CP437 and Hong Kong 速成 (Simplex)."
license = "MIT"
repository = "https://github.com/TimothyLam1017/on99KB"
readme = "README.md"
keywords = ["keyboard", "cp437", "simplex", "windows", "accessibility"]
categories = ["gui"]
publish = false

[lib]
name = "on99kb"
path = "src/lib.rs"

[[bin]]
name = "on99KB"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
